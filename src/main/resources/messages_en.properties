# Help Menu
menu.header======================= MENU HELP =========================
menu.instruction=Type one of the commands below to interact with the game:
cmd.gerafrota=Generates a random fleet of ships.
cmd.lefrota=Allows creating and loading a custom fleet.
cmd.estado=Shows current fleet status.
cmd.mapa=Displays the fleet map.
cmd.rajada=Performs a burst of shots. 
cmd.simula=Simulates a complete game.
cmd.tiros=Lists valid shots made (* = hit on ship, o = shot in water)
cmd.desisto=Quits the game.
