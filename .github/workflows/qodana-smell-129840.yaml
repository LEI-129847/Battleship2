# 129840 Diogo Teixeira
name: Qodana smell gate 129840
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run Qodana Quality Gate
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-129840.yaml
          use-annotations: true
          post-pr-comment: true
