#129827 - Miguel Antão
name: Qodana — God Class

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Análise Qodana
        uses: JetBrains/qodana-action@v2026.2.0
        with:
          args: --config qodana.yaml
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
