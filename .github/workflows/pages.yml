name: Publicar Javadoc no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Gerar Javadoc com Maven
        run: mvn -B javadoc:javadoc
      - name: Preparar pasta do site
        run: |
          mkdir site
          if [ -d target/reports/apidocs ]; then cp -R target/reports/apidocs/* site/; else cp -R target/site/apidocs/* site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
